{% extends "base.html" %}
{% block content %}
<h2>할 일 수정</h2>
<form class="edit-form" method="post">
  <label>내용
    <input type="text" name="title" value="{{ todo.title }}" required>
  </label>
  <label>우선순위
    <select name="priority">
      {% for key, label in priorities.items() %}
        <option value="{{ key }}" {% if key == todo.priority %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>마감일
    <input type="date" name="due_date" value="{{ todo.due_date or '' }}">
  </label>
  <div class="actions">
    <button type="submit">저장</button>
    <a href="{{ url_for('index') }}">취소</a>
  </div>
</form>
{% endblock %}
